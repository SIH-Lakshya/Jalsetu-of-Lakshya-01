name: jolsetu
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  firebase_storage: ^13.6.0

  # State Management
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Networking
  dio: ^5.7.0

  # Local Database (Offline-first)
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path: ^1.9.0
  path_provider: ^2.1.5

  # Secure Storage
  flutter_secure_storage: ^11.2.0

  # Location & GPS
  geolocator: ^14.1.1
  permission_handler: ^13.0.2

  # Maps
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

  # Image/Photo handling
  image_picker: ^1.1.2
  camera: ^0.12.1
  photo_manager: ^3.5.0

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  equatable: ^3.0.0

  # Connectivity
  connectivity_plus: ^7.3.1

  # Background sync
  workmanager: ^0.10.10

  # Logging
  logger: ^2.5.0

  # Navigation
  go_router: ^18.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.13
  riverpod_generator: ^4.0.9
  drift_dev: ^2.35.1
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  analyzer: ^14.4.0

flutter:
  uses-material-design: true